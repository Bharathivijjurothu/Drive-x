
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - DriveX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

  
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold fs-3" href="index.html">
                Drive<span class="text-warning">X</span>
            </a>

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="cars.html">Cars</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link active" href="contact.html">Contact</a>

            </div>

        </div>

    </nav>


    <section class="bg-dark text-white text-center py-5">

        <div class="container">

            <h1 class="display-4 fw-bold">Contact Us</h1>

            <p class="lead">
                Get in touch with our team.
            </p>

        </div>

    </section>


  
    <section class="container py-5">

        <div class="row g-5">

         
            <div class="col-md-5">

                <h2 class="fw-bold mb-4">Get In Touch</h2>

                <div class="card shadow border-0 p-4">

                    <h5 class="fw-bold">Address</h5>

                    <p class="text-secondary">
                        DriveX Showroom,
                        Visakhapatnam,
                        Andhra Pradesh.
                    </p>

                    <hr>

                    <h5 class="fw-bold">Email</h5>

                    <p class="text-secondary">
                        hello@drivex.example
                    </p>

                    <hr>

                    <h5 class="fw-bold">Phone</h5>

                    <p class="text-secondary">
                        +91 90000 00000
                    </p>

                </div>

            </div>


            
            <div class="col-md-7">

                <div class="card shadow border-0 p-4">

                    <h3 class="fw-bold mb-4">
                        Send Your Enquiry
                    </h3>

                    <form>

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                            class="form-control"
                            placeholder="Enter your name">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                            class="form-control"
                            placeholder="Enter your email">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Select Car
                            </label>

                            <select class="form-select">

                                <option>Select a car</option>

                                <option>Porsche 911</option>

                                <option>Range Rover</option>

                                <option>Chevrolet Camaro</option>

                                <option>Ford Mustang</option>

                                <option>Other</option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Message
                            </label>

                            <textarea class="form-control"
                            rows="2"
                            placeholder="Enter your message"></textarea>

                        </div>


                        <button type="button"
                        class="btn btn-warning w-100 fw-bold">

                            Submit Enquiry

                        </button>

                    </form>

                    
                </div>

            </div>

        </div>

    </section>


   
    <footer class="bg-black text-white text-center py-3">

        <p class="mb-0">© 2026 DriveX Car Showroom.</p>

    </footer>

</body>
</html>
